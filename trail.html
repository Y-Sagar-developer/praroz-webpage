<!DOCTYPE html>
<html>

<head>
    <title>PraRoz</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial;
    }

    .main {
        width: 100%;
        height: 100vh;
        background-image: url(bg.jpg);
        background-size: cover;
        background-position: center;
        color: black;
    }

    /* navbar */

    nav {
        display: flex;
        justify-content: space-between;
        padding: 20px 80px;
    }

    .logo {
        color: orange;
        font-size: 32px;
    }

    ul {
        display: flex;
        list-style: none;
    }

    ul li {
        margin-left: 40px;
    }

    ul li a {
        text-decoration: none;
        color: black;
        font-weight: bold;
    }

    /* content */

    .content {
        margin-left: 80px;
        margin-top: 120px;
        max-width: 500px;
    }

    .content h1 {
        font-size: 50px;
    }

    .content span {
        color: orange;
    }

    .content p {
        margin-top: 20px;
        line-height: 1.6;
    }

    button {
        margin-top: 20px;
        padding: 10px 25px;
        background: orange;
        border: none;
        font-weight: bold;
        border-radius: 5px;
    }
</style>

<body>

    <div class="main">

        <nav>
            <h2 class="logo">PraRoz</h2>

            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICE</a></li>
                <li><a href="#">DESIGN</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>

        </nav>


        <div class="content">

            <h1>Web Design & <br><span>Development</span> <br>Course</h1>

            <p>
                Web Design is a specialisation of the design stream.
                They also use HTML, CSS, WYSIWYG editing software, mark up validators etc
                to create design elements.
            </p>

            <button>JOIN US</button>

        </div>

    </div>

</body>

</html>
